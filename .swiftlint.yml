included:
    - SoundMixer
    - Tests
excluded:
    - DerivedData
# SwiftFormat places braces after long multiline conditions on a new line.
disabled_rules:
    - opening_brace
opt_in_rules:
    - indentation_width
indentation_width:
    indentation_width: 4
    include_comments: true
line_length:
    warning: 140
    error: 180
