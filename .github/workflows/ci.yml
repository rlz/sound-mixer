name: Проверка

on:
    push:
    pull_request:

jobs:
    check:
        runs-on: xcode-27
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 26.8.1
                  cache: npm
                  cache-dependency-path: Web/package-lock.json
            - name: Форматирование, линтеры и сборка
              run: ./scripts/check.sh
